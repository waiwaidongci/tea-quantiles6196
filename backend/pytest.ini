[pytest]
env =
    LARGE_SEGMENT_BYTES=1024
    LARGE_MERGE_FANOUT=3
    LARGE_ECDF_PAGE_ROWS=4
    LARGE_READER_BYTES=256
    LARGE_ARTIFACT_DIR=tests/.tmp-artifacts
    DATABASE_URL=sqlite:///./tests/.tmp-artifacts/test-env.db
    REDIS_URL=redis://localhost:6379/0
    JWT_SECRET=test-secret
testpaths = tests
